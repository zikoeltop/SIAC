{% if page.has_other_pages %}<div class="pagination">{% if page.has_previous %}<a href="?{% if query %}q={{ query|urlencode }}&{% endif %}{% if selected_type %}type={{ selected_type|urlencode }}&{% endif %}page={{ page.previous_page_number }}">السابق</a>{% endif %}<span>صفحة {{ page.number }} من {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?{% if query %}q={{ query|urlencode }}&{% endif %}{% if selected_type %}type={{ selected_type|urlencode }}&{% endif %}page={{ page.next_page_number }}">التالي</a>{% endif %}</div>{% endif %}
