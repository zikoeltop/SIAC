{% extends 'base.html' %}{% block content %}<div class="card"><h2>Audit Log</h2><table><tr><th>التاريخ</th><th>المستخدم</th><th>العملية</th><th>IP</th><th>التفاصيل</th></tr>{% for log in logs %}<tr><td>{{ log.created_at }}</td><td>{{ log.user.username|default:'-' }}</td><td>{{ log.get_action_display }}</td><td>{{ log.ip_address|default:'-' }}</td><td>{{ log.description }}</td></tr>{% endfor %}</table></div>{% endblock %}
